name: Release and publish extension

on:
  push:
    branches:
      - main
    paths:
      - package.json

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
jobs:
  check-version-change:
    outputs:
      changed: ${{ steps.check-version.outputs.result }}
    name: Check Version Change

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Check if version has changed
        id: check-version
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ github.event.inputs.version }}' || require('./package.json').version;
            // Find a release for that version
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `release-v${version}`,
            }).catch(() => null);
            // If the release exists, the version has not changed
            if (release) {
              console.log(`Version ${version} has an existing release`);
              console.log(release.data.html_url);
              core.summary.addLink(`Release v${version}`, release.data.html_url);
              await core.summary.write();
              return "false";
            }
            console.log(`Version ${version} does not have a release`);
            return true;
  release:
    needs: check-version-change
    if: ${{ needs.check-version-change.outputs.changed == 'true' }}

    runs-on: ubuntu-latest
    name: Build and Release on GitHub

    permissions:
      contents: write
      packages: read

    env:
      EXT_VERSION: "" # will be set in the workflow

    outputs:
      version: ${{ env.EXT_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16.x
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Parse version from package.json
        run: |
          echo "EXT_VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create bundled Python environment
        run: |
          # Create directory for bundled Python
          mkdir -p bundled-python

          pip install --target ./bundled-python -r requirements.txt

          # Remove unnecessary files to reduce size
          find ./bundled-python -name "*.pyc" -delete
          find ./bundled-python -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find ./bundled-python -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true
          find ./bundled-python -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find ./bundled-python -name "test_*" -delete 2>/dev/null || true
          find . -name "*_test.py" -delete 2>/dev/null || true

          echo "Bundled Python environment created with $(du -sh ./bundled-python | cut -f1) of dependencies"
          echo "Contents of bundled-python:"
          ls -la ./bundled-python/

      - name: Create Python path setup and update server files
        run: |
          # Create a path setup script that can be imported
          cat > bundled/tool/setup_bundled_path.py << 'EOF'
          #!/usr/bin/env python3
          """
          Setup script to add bundled dependencies to Python path
          This should be imported at the top of any Python file that needs bundled dependencies
          """
          import sys
          import os

          def setup_bundled_path():
              # Get the extension root directory (go up from bundled/tool/)
              current_dir = os.path.dirname(os.path.abspath(__file__))
              extension_root = os.path.dirname(os.path.dirname(current_dir))
              bundled_python_path = os.path.join(extension_root, 'bundled-python')

              # Add bundled packages to Python path at the beginning
              if bundled_python_path not in sys.path:
                  sys.path.insert(0, bundled_python_path)

              return bundled_python_path

          # Auto-setup when imported
          setup_bundled_path()
          EOF

          # Function to add bundled path setup after future imports
          add_bundled_setup() {
              local file="$1"
              local temp_file="${file}.new"

              # Create backup
              cp "$file" "$file.bak"

              # Read the file and find where to insert the import
              python3 << EOF
          import re
          import sys

          def process_file(filename):
              with open(filename, 'r') as f:
                  content = f.read()

              lines = content.split('\n')
              insert_index = 0

              # Skip shebang line
              if lines and lines[0].startswith('#!'):
                  insert_index = 1

              # Skip encoding declarations
              while insert_index < len(lines):
                  line = lines[insert_index].strip()
                  if line.startswith('#') and ('coding' in line or 'encoding' in line):
                      insert_index += 1
                  else:
                      break

              # Skip docstrings at the top
              while insert_index < len(lines):
                  line = lines[insert_index].strip()
                  if line.startswith('"""') or line.startswith("'''"):
                      # Handle multi-line docstring
                      quote = line[:3]
                      if line.count(quote) == 1:  # Docstring continues on next lines
                          insert_index += 1
                          while insert_index < len(lines) and quote not in lines[insert_index]:
                              insert_index += 1
                          if insert_index < len(lines):
                              insert_index += 1
                      else:  # Single line docstring
                          insert_index += 1
                      break
                  elif line.startswith('"') or line.startswith("'"):
                      # Handle single-line docstring
                      insert_index += 1
                      break
                  elif line == '' or line.startswith('#'):
                      # Skip empty lines and comments
                      insert_index += 1
                  else:
                      break

              # Skip future imports - these MUST stay at the top
              while insert_index < len(lines):
                  line = lines[insert_index].strip()
                  if line.startswith('from __future__ import'):
                      insert_index += 1
                  elif line == '' or line.startswith('#'):
                      # Skip empty lines and comments after future imports
                      insert_index += 1
                  else:
                      break

              # Insert the bundled path setup
              setup_lines = [
                  '# Setup bundled Python path before any other imports',
                  'import setup_bundled_path',
                  ''
              ]

              # Insert the setup lines at the determined position
              new_lines = lines[:insert_index] + setup_lines + lines[insert_index:]

              # Write the modified content
              with open('${temp_file}', 'w') as f:
                  f.write('\n'.join(new_lines))

          process_file('$file')
          EOF

              # Replace the original file with the modified one
              mv "$temp_file" "$file"
          }

          # Update lsp_server.py to import the setup script first
          if [ -f bundled/tool/lsp_server.py ]; then
              echo "Updating lsp_server.py to include bundled path setup"
              add_bundled_setup bundled/tool/lsp_server.py
          fi

          # Update any other Python files that might need bundled dependencies
          for file in bundled/tool/*.py; do
              if [[ "$file" != *"setup_bundled_path.py" ]] && [[ "$file" != *"lsp_server.py" ]]; then
                  if grep -q "import lsprotocol\|from lsprotocol\|import pygls\|from pygls" "$file"; then
                      echo "Updating $file to include bundled path setup"
                      add_bundled_setup "$file"
                  fi
              fi
          done

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: create a package.json that actions/upload will like
        run: |
          cp package.json package.json.real
          sed --regexp-extended '/"name"\s*:/ s#@[a-zA-Z\\-]+/##' package.json.real > package.json

      - name: Update .vscodeignore to include bundled Python
        run: |
          # Make sure bundled-python is NOT ignored (remove from .vscodeignore if present)
          if [ -f .vscodeignore ]; then
            sed -i '/^bundled-python/d' .vscodeignore
          fi

          # Add common patterns to ignore to keep package size down
          cat >> .vscodeignore << 'EOF'
          # But keep these patterns to reduce size
          bundled-python/**/*.pyc
          bundled-python/**/__pycache__/
          bundled-python/**/tests/
          bundled-python/**/*.dist-info/
          EOF

      - run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: xray-${{ env.EXT_VERSION }}.vsix
          path: ./xray-${{ env.EXT_VERSION }}.vsix

      - name: restore old package.json
        run: mv package.json.real package.json

      - name: Create release and upload release asset
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "release-v${{ env.EXT_VERSION }}",
              name: "v${{ env.EXT_VERSION }}",
              draft: false,
              prerelease: false
            });
            const path = "./xray-${{ env.EXT_VERSION }}.vsix";
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              data: fs.readFileSync(path),
              name: "xray-${{ env.EXT_VERSION }}.vsix",
              headers: {
                "content-type": "application/vsix",
                "content-length": fs.statSync(path).size
              }
            });
            core.summary.addLink(`Release v${{ env.EXT_VERSION }}`, release.data.html_url);
            await core.summary.write();

  open-vsx-publish:
    name: Publish to Open VSX Registry
    needs: release
    environment: publish-open-vsx
    runs-on: ubuntu-latest
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: xray-${{ needs.release.outputs.version }}.vsix

      - name: Publish to Registry
        run: |
          npx ovsx publish -p $OPEN_VSX_TOKEN *.vsix
